<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>{{ site_title }} — savannah.dev</title>
     <meta name="description" content="{{ page_description }}">
     <meta name="author" content="{{ site_name }}">
     <meta name="theme-color" content="#1c211f">
     <meta name="color-scheme" content="dark">
     <link rel="canonical" href="{{ page_url }}">
     <link rel="icon" type="image/x-icon" href="/favicon.ico">
     <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
     <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
     <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
     <link rel="alternate" type="application/rss+xml" title="{{ site_name }} RSS" href="/index.xml">
     <meta property="og:type" content="website">
     <meta property="og:site_name" content="{{ site_name }}">
     <meta property="og:title" content="{{ site_title }}">
     <meta property="og:description" content="{{ page_description }}">
     <meta property="og:url" content="{{ page_url }}">
     <meta property="og:image" content="{{ page_image }}">
     <meta name="twitter:card" content="summary_large_image">
     <meta name="twitter:title" content="{{ site_title }}">
     <meta name="twitter:description" content="{{ page_description }}">
     <meta name="twitter:image" content="{{ page_image }}">
     <link rel="stylesheet" href="/static/css/site.css?v=20261113-7">
     <script src="/static/js/site.js?v=20261113-1" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="container">
        <header class="site-header">
            <a href="/" class="site-title" aria-label="savannah.dev home">savannah<span>.dev</span></a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="/#writing"{% if page_url == site_url + '/' or '/posts/' in page_url or '/tags/' in page_url %} aria-current="page"{% endif %}>writing</a>
                <a href="/talks/"{% if page_url == site_url + '/talks/' %} aria-current="page"{% endif %}>talks</a>
                <a href="/about/"{% if page_url == site_url + '/about/' %} aria-current="page"{% endif %}>about</a>
            </nav>
        </header>
        <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
        <footer class="site-footer">
            <p class="copyright">© 2024–{{ current_year }} Savannah Ostrowski</p>
            <nav class="footer-links" aria-label="Site links">
                <a href="https://github.com/sponsors/savannahostrowski" target="_blank" rel="noopener">Sponsor</a>
                <a href="/index.xml" aria-label="RSS feed">RSS</a>
            </nav>
        </footer>
    </div>
</body>
</html>
