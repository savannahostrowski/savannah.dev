<ul class="post-list">
    {% for post in posts %}
    <li class="post-item">
        <div class="post-date"><time datetime="{{ post.date.isoformat() }}">{{ post.date.strftime("%b %d, %Y") }}</time></div>
        <div class="post-item-content">
            <h{{ list_heading | default(3) }}><a href="/posts/{{ post.slug }}/">{{ post.title }}</a></h{{ list_heading | default(3) }}>
            {% if post.summary %}<p class="post-summary">{{ post.summary }}</p>{% endif %}
        </div>
    </li>
    {% endfor %}
</ul>
